name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api-gateway-nest, issue-service-nest, web-client]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - if: matrix.app == 'issue-service-nest'
        run: npm run test:unit
      - if: matrix.app != 'issue-service-nest'
        run: npm test
      - run: npm run build
      - if: matrix.app == 'web-client'
        run: npm run lint
      - if: matrix.app == 'web-client'
        run: npm run typecheck

  issue-lifecycle-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: issue_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d issue_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/issue-service-nest
    env:
      ISSUE_SERVICE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/issue_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/issue-service-nest/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/iam-service-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B package -Dmaven.test.skip=true

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build apps/project-service-dotnet/ProjectService.csproj --configuration Release

  project-access-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROJECT_SERVICE_TEST_DATABASE_URL: Host=localhost;Port=5432;Database=project_test_db;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/project-service-dotnet-tests/ProjectService.Tests.csproj --configuration Release

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/notification-service-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/notification-service-go/go.sum
      - run: go test ./...
      - run: go build ./...

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          # This job only interpolates the Compose file; it does not start services.
          INTERNAL_SERVICE_SECRET: ci-compose-contract-placeholder
        run: docker compose -f infra/docker-compose/docker-compose.yml config --quiet
      - run: jq empty contracts/events/issue-event-v1.schema.json contracts/health.schema.json
