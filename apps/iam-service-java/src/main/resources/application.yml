server:
  port: ${PORT:8081}
  address: 0.0.0.0

spring:
  application:
    name: iam-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/iam_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/iam_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:60}
    issuer: ${JWT_ISSUER:jira-like-iam}
    audience: ${JWT_AUDIENCE:jira-like-api}
  refresh-token:
    ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}

# Tracing (ADR 0006). IamServiceApplication turns it off, or points it at the
# OTLP endpoint, from OTEL_EXPORTER_OTLP_ENDPOINT.
management:
  server:
    # Tracing needs Actuator's auto-configuration, not its HTTP endpoints.
    port: -1
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      "[service.name]": ${OTEL_SERVICE_NAME:iam-service}
