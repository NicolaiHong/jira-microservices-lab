services:
  postgres:
    image: postgres:16-alpine
    container_name: local-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: local-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    container_name: local-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
    expose:
      - "9092"
      - "9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  api-gateway:
    build:
      context: ../../apps/api-gateway-nest
    container_name: api-gateway
    environment:
      PORT: 3000
      IAM_SERVICE_URL: http://iam-service:8081
      PROJECT_SERVICE_URL: http://project-service:8082
      ISSUE_SERVICE_URL: http://issue-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-1500}
      HTTP_CLIENT_TIMEOUT_MS: ${HTTP_CLIENT_TIMEOUT_MS:-3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/docker-compose/.env}
      JWT_ISSUER: ${JWT_ISSUER:-jira-like-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-jira-like-api}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in infra/docker-compose/.env}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      iam-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      issue-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  web-client:
    build:
      context: ../../apps/web-client
      args:
        # Baked into the browser bundle at build time. The browser runs on the host,
        # so this is the host-published Gateway URL, not a Compose service name.
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:${API_GATEWAY_PORT:-3000}}
    container_name: web-client
    ports:
      # CORS_ALLOWED_ORIGINS must list this origin (http://localhost:3001).
      - "3001:3001"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/login"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  iam-service:
    build:
      context: ../../apps/iam-service-java
    container_name: iam-service
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/iam_db
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/docker-compose/.env}
      JWT_ISSUER: ${JWT_ISSUER:-jira-like-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-jira-like-api}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-60}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in infra/docker-compose/.env}
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  project-service:
    build:
      context: ../../apps/project-service-dotnet
    container_name: project-service
    environment:
      PORT: 8082
      DATABASE_URL: Host=postgres;Port=5432;Database=project_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      IAM_SERVICE_URL: http://iam-service:8081
      HTTP_CLIENT_TIMEOUT_MS: ${HTTP_CLIENT_TIMEOUT_MS:-3000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in infra/docker-compose/.env}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
    healthcheck:
      # The aspnet runtime image ships no wget or curl, so bash sends the GET over /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8082 &&
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  issue-service:
    build:
      context: ../../apps/issue-service-nest
    container_name: issue-service
    environment:
      PORT: 8083
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/issue_db
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      PROJECT_SERVICE_URL: http://project-service:8082
      HTTP_CLIENT_TIMEOUT_MS: ${HTTP_CLIENT_TIMEOUT_MS:-3000}
      ISSUE_EVENTS_TOPIC: ${ISSUE_EVENTS_TOPIC:-issue.events.v1}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in infra/docker-compose/.env}
    expose:
      - "8083"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      project-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8083/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  notification-service:
    build:
      context: ../../apps/notification-service-go
    container_name: notification-service
    environment:
      PORT: 8084
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      ISSUE_EVENTS_TOPIC: ${ISSUE_EVENTS_TOPIC:-issue.events.v1}
      PROJECT_SERVICE_URL: http://project-service:8082
      HTTP_CLIENT_TIMEOUT_MS: ${HTTP_CLIENT_TIMEOUT_MS:-3000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in infra/docker-compose/.env}
    expose:
      - "8084"
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8084/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

volumes:
  postgres-data:
